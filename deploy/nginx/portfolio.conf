# /etc/nginx/sites-available/portfolio  (symlinked into sites-enabled)
# Only the HTTP block is written by hand: `certbot --nginx -d vicenteruiz.ddnsfree.com`
# adds the TLS block and the http -> https redirect, with its own certificate.
# 5 requests/second per IP, bursts of 20: far above a person, below a script.
limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vicenteruiz.ddnsfree.com;

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
